; ===========================================================================
; viz.cfg - telemetry-overlay configuration for GPXSee
; ---------------------------------------------------------------------------
; GPX tracks may carry optional per-point telemetry in <trkpt><extensions>.
; This file controls display labels, status names, and overlay styling.
;
; Search order (a later file overrides an earlier one; omitted keys keep the
; built-in default shown below):
;     1)  <GPXSee executable directory>\viz.cfg   (this file, shipped)
;     2)  %APPDATA%\GPXSee\viz.cfg                (per-user override)
;
; Syntax:  ; or # = comment,  [section] headers,  key = value.
; Colours are  R,G,B  or  R,G,B,A   (each 0-255).
; ===========================================================================

[radar]
; Visual length of the sensor scan wedge / look ray drawn on the map, in metres.
fov_range_m = 55560
; Sector width (deg) for the wedge when the track's scan-mode code is unknown.
scan_default_deg = 60
; Wedge colour for any radar state not listed in [radar_states].
default_color = 120,120,120
; Status text colour while the radar is active (state >= SEARCH).
active_color = 0,150,0
; Scan label shown during a lock (single-target track has no sector scan).
lock_scan_label = single-target track

[radar_states]
; Zhuk radar state from the <radar_state> extension. The map wedge/ray and the
; Live Stats / Sensor panels are all driven by this — nothing is hardcoded.
; <state code> = <display name> | <status colour R,G,B>   (colour optional)
; The decoder records 0=OFF, 1=SEARCH, 2=LOCK. A code with no entry here is
; shown as its number. (These are display labels only — the value shown is the
; raw recorded byte.)
0 = OFF
1 = SEARCH | 40,120,255
2 = LOCK   | 230,30,30

[radar_scan_modes]
; <radar_scan_mode code> = <FOV sector width in degrees>
; USER-DRIVEN display table, NOT a measured/derived value. The cartridge records
; only the scan-mode code (the raw 0x14E byte); YOU choose how wide to draw the
; on-map FOV wedge for each code here. 0 = pencil beam (no wedge, look-ray only).
; Unlisted codes fall back to [radar].scan_default_deg. Tune these to taste.
1  = 0
32 = 60
40 = 84

[overlay]
; The map draws only RECORDED, non-fused geometry: the FOV wedge / look-ray are
; anchored to the recorded absolute antenna azimuth (radarAz) or heading
; boresight; the beacon ray uses the recorded absolute beacon bearing. There is
; deliberately no targets/contacts marker (that would need heading+bearing
; fusion); the raw target values are in the Targets panel instead.
show_scan_wedge = true
show_look_ray = true
look_ray_color = 20,180,220
look_ray_width_px = 2
; track_color / contact_color tint the raw values in the Targets panel.
track_color = 255,170,0
contact_color = 230,30,30
beacon_color = 30,170,120

[labels]
; Human-readable interpretation of the discrete-state extensions in Live Stats.
missing = —
gear_down = DOWN
gear_up = UP
wow_ground = ON GROUND
wow_air = AIRBORNE
slats_out = OUT
slats_in = IN

[panels]
telemetry = Telemetry
flight = Flight
