; ===========================================================================
; viz.cfg  —  telemetry-overlay configuration for GPXSee
; ---------------------------------------------------------------------------
; GPX tracks may carry custom per-point telemetry in <trkpt><extensions>.
; This file controls how those values are INTERPRETED for display by the Live
; Stats dock and the radar / target overlay, so NOTHING is hard-coded in the
; binary. Edit a value and restart GPXSee.
;
; Search order (a later file overrides an earlier one; omitted keys keep the
; built-in default shown below):
;     1)  <GPXSee executable directory>\viz.cfg   (this file, shipped)
;     2)  %APPDATA%\GPXSee\viz.cfg                (per-user override)
;
; Syntax:  ; or # = comment,  [section] headers,  key = value.
; Colours are  R,G,B  or  R,G,B,A   (each 0-255).
; ===========================================================================

[radar]
; Visual length of the radar FOV wedge drawn on the map, in metres (~30 NM).
fov_range_m = 55560
; Sector width (deg) used for the wedge when the track's scan width is absent.
scan_default_deg = 60
; The radar is treated as "on" when its mode value is greater than this.
on_min_code = 0
; Wedge colour for any mode value not listed in [radar_modes].
default_color = 120,120,120
; Live-Stats "Radar mode" text colour while the radar is on.
active_color = 0,150,0

[radar_modes]
; <mode value> = <display name> | <wedge colour R,G,B>    (colour is optional)
; The mode value is read verbatim from the track's <radar_mode> extension.
0  = OFF
64 = RWS (search) | 40,120,255
68 = TWS (track)  | 255,170,0
72 = STT (lock)   | 230,30,30
76 = Combat       | 200,0,120

[weapon]
; Live-Stats shows the engaged label when the <weapon> extension >= threshold.
engaged_threshold = 1
engaged_color = 200,0,0
engaged_label = ENGAGED
idle_label = -

[contact]
; Contact crosshair drawn on the map from the <contact_bearing>/<contact_range>
; extensions, projected from the aircraft position.
target_color = 230,30,30
target_radius_px = 7

[labels]
; Human-readable interpretation of the discrete-state extensions in Live Stats.
gear_down = DOWN
gear_up = up
wow_ground = ON GROUND
wow_air = airborne
slats_out = OUT
slats_in = in
