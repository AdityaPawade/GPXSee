; ===========================================================================
; viz.cfg - telemetry-overlay configuration for GPXSee
; ---------------------------------------------------------------------------
; GPX tracks may carry optional per-point telemetry in <trkpt><extensions>.
; This file controls display labels, status names, and overlay styling.
;
; Search order (a later file overrides an earlier one; omitted keys keep the
; built-in default shown below):
;     1)  <GPXSee executable directory>\viz.cfg   (this file, shipped)
;     2)  %APPDATA%\GPXSee\viz.cfg                (per-user override)
;
; Syntax:  ; or # = comment,  [section] headers,  key = value.
; Colours are  R,G,B  or  R,G,B,A   (each 0-255).
; ===========================================================================

[radar]
; Visual length of the sensor scan wedge drawn on the map, in metres.
fov_range_m = 55560
; Sector width (deg) used for the wedge when the track's scan width is absent.
scan_default_deg = 60
; The sensor is treated as active when its mode value is greater than this.
on_min_code = 0
; Wedge colour for any mode value not listed in [radar_modes].
default_color = 120,120,120
; Mode text colour while the sensor is active.
active_color = 0,150,0
; Scan-width label shown during a lock (single-target track has no sector scan).
lock_scan_label = single-target track

[radar_modes]
; <mode value> = <display name> | <wedge colour R,G,B>    (colour is optional)
; The mode value is read verbatim from the track's <radar_mode> extension.
0  = OFF
64 = Search | 40,120,255
68 = Track  | 255,170,0
72 = Lock   | 230,30,30
76 = Event  | 200,0,120

[radar_states]
; Continuous radar state shown in Live Stats. A raw search-mode field can read OFF
; while locked on a single target; this fused state stays ON whenever a target is
; being tracked, so the timeline is continuous.
; <state code> = <display name>
0 = OFF
1 = SEARCH
2 = LOCK

[event]
; Live-Stats shows the active label when the <event> extension >= threshold.
active_threshold = 1
active_color = 200,0,0
active_label = ACTIVE
idle_label = -

[overlay]
show_scan_wedge = true
show_look_ray = true
show_track = true
show_contact = true
look_ray_color = 20,180,220
look_ray_width_px = 2
track_color = 255,170,0
track_radius_px = 7
contact_color = 230,30,30
contact_radius_px = 6
target_line_width_px = 1

[labels]
; Human-readable interpretation of the discrete-state extensions in Live Stats.
missing = —
gear_down = DOWN
gear_up = up
wow_ground = ON GROUND
wow_air = airborne
slats_out = OUT
slats_in = in

[panels]
live_stats = Live Stats
sensor = Radar
targets = Targets

[playback]
reference_year = 2026
speeds = 1,2,8,16,32
play_label = Play
pause_label = Pause
speed_label = Speed
speed_suffix = x
elapsed_label = Elapsed
remaining_label = Remaining
clock_format = yyyy-MM-dd HH:mm:ss
clock_style = QLabel { background: rgba(0,0,0,160); color: white; padding: 6px 16px; border-radius: 4px; font: 700 24px; }
timer_interval_ms = 33

[sync]
button_label = Sync...
dialog_title = Track sync
offset_label = Offset
direction_label = + = later
reset_label = Reset
reset_all_label = Reset all
range_minutes = 60
step_seconds = 1

[fields]
parameter = Parameter
value = Value
track_name = Track
position = Position
yaw = Heading
pitch = Pitch
roll = Roll
airspeed = Airspeed
vspeed = Vert. speed
roll_rate = Roll rate
yaw_rate = Yaw rate
sensor_mode = Radar mode
scan_width = Radar scan width
scan_program = Radar scan program
look_az = Radar look azimuth
track_bearing = Radar track bearing rel / abs
track_range = Radar track range
contact_bearing = Datalink contact bearing rel / abs
contact_range = Datalink contact range
contact_alt = Datalink contact rel altitude
bearing_rel = Bearing rel
bearing_abs = Bearing abs
nav_bearing = Nav bearing
nav_range = Nav range
fuel = Fuel
gear = Gear
wow = Weight-on-wheels
auto_slats = Auto-slats
event = Event
